<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ledgerline — see where your money goes" />
    <meta name="theme-color" content="#14212B" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Ledgerline</title>
    <script>
      // Apply the saved theme before the first paint, so the page never flashes the wrong colours.
      try {
        var t = localStorage.getItem('ledgerline-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
